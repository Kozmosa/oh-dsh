name: Linux Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Cache release build inputs
        uses: actions/cache@v5
        with:
          path: |
            .cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-release-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'dsh-source.json') }}

      - name: Verify release tag
        shell: bash
        run: |
          package_version=$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; console.log(manifest.version)")
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit on main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Linux packages
        run: pnpm run dist:linux

      - name: Configure Electron sandbox
        shell: bash
        run: |
          electron_directory=$(dirname "$(node -e "console.log(require('electron'))")")
          sudo chown root:root "${electron_directory}/chrome-sandbox"
          sudo chmod 4755 "${electron_directory}/chrome-sandbox"

      - name: Run packaged runtime smoke test
        run: xvfb-run --auto-servernum pnpm run smoke:app:linux

      - name: Verify Linux packages
        shell: bash
        run: |
          version=$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; console.log(manifest.version)")
          appimage="release/Oh-DSH-Desktop-${version}-x86_64.AppImage"
          deb="release/Oh-DSH-Desktop-${version}-amd64.deb"

          test -s "${appimage}"
          test -x "${appimage}"
          test -s "${deb}"
          test "$(dpkg-deb --field "${deb}" Architecture)" = "amd64"
          test "$(dpkg-deb --field "${deb}" Version)" = "${version}"

          extract_directory=$(mktemp -d)
          trap 'rm -rf "${extract_directory}"' EXIT
          (
            cd "${extract_directory}"
            "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null
            test -x squashfs-root/oh-dsh-desktop
          )

          (
            cd release
            sha256sum "$(basename "${appimage}")" "$(basename "${deb}")" > SHA256SUMS-linux.txt
          )

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node --input-type=module -e "import manifest from './package.json' with { type: 'json' }; console.log(manifest.version)")
          assets=(
            "release/Oh-DSH-Desktop-${version}-x86_64.AppImage"
            "release/Oh-DSH-Desktop-${version}-amd64.deb"
            "release/SHA256SUMS-linux.txt"
          )

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            release_options=(
              --verify-tag
              --title "Oh-DSH-Desktop ${version}"
              --generate-notes
            )
            if [[ "${version}" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" "${release_options[@]}" "${assets[@]}"
          fi
